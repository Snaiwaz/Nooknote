[package]
name = "nooknote"
version = "1.0.0"
description = "A quiet edge-mounted scratchpad for Windows"
authors = ["Snaiwaz"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
